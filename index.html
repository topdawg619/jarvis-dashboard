<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentra Ops Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05070f;--panel:#101424;--panel-dark:#0b0f1a;--border:#1b2138;--accent:#00d4ff;--accent2:#7b61ff;--text:#eef2ff;--dim:#78809b;--good:#4ade80;--warn:#facc15;--danger:#fb7185}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(0,212,255,.08),transparent 45%),radial-gradient(circle at 80% 0%,rgba(123,97,255,.08),transparent 40%);pointer-events:none;z-index:0}
.container{max-width:1200px;margin:0 auto;padding:24px;position:relative;z-index:1}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--border)}
header h1{font-size:1.8rem;letter-spacing:10px;font-weight:200;text-transform:uppercase;color:var(--accent)}
header .meta{font-size:.8rem;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-card .label{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.stat-card .value{font-size:1.8rem;font-weight:600;margin-top:4px}
.stat-card.good .value{color:var(--good)}
.stat-card.warn .value{color:var(--warn)}
.stat-card.neutral .value{color:var(--accent)}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
section{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
section h2{padding:14px 16px;border-bottom:1px solid var(--border);font-size:.95rem;letter-spacing:1px}
section .body{padding:16px}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.column{background:var(--panel-dark);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column}
.column header{border:none;padding:12px 14px}
.column header h3{font-size:.9rem;margin-right:auto}
.column header span{font-size:.65rem;color:var(--dim)}
.column .cards{padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.task{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02);cursor:pointer;transition:transform .2s,background .2s}
.task:hover{transform:translateY(-2px);background:rgba(255,255,255,.04)}
.task h4{font-size:.85rem;margin-bottom:4px}
.task p{font-size:.7rem;color:var(--dim)}
.task .tag{display:inline-block;margin-top:6px;font-size:.6rem;padding:2px 8px;border-radius:999px;background:rgba(0,212,255,.15);color:var(--accent);letter-spacing:1px}
.task .links{margin-top:6px;font-size:.65rem}
.task .links a{color:var(--accent);text-decoration:none;margin-right:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
.modal.open{display:flex}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:640px;width:90%;max-height:80vh;overflow:auto;position:relative;box-shadow:0 0 50px rgba(0,0,0,.65)}
.modal-card h3{font-size:1.3rem;margin-bottom:8px}
.modal-card .modal-tag{display:inline-block;margin-bottom:14px;font-size:.75rem;padding:4px 10px;border-radius:999px;background:rgba(0,212,255,.18);color:var(--accent);letter-spacing:1px}
.modal-card p{font-size:.9rem;color:#cfd2e7;margin-bottom:16px}
.modal-card .modal-links a{display:inline-block;margin-right:12px;margin-bottom:8px;color:var(--accent);font-size:.8rem;text-decoration:none}
.modal-close{position:absolute;top:12px;right:18px;font-size:1.4rem;color:var(--dim);cursor:pointer}

/* Conversations */
.convo-item{border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0}
.convo-item:last-child{border:none}
.convo-meta{font-size:.7rem;color:var(--dim);letter-spacing:1px}
.convo-title{font-size:.85rem;font-weight:600;margin:2px 0}
.convo-body{font-size:.75rem;color:#c1c6e0}

/* Deliverables */
.deliverable{border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0}
.deliverable:last-child{border:none}
.deliverable h4{font-size:.82rem}
.deliverable p{font-size:.72rem;color:var(--dim)}
.deliverable a{font-size:.7rem;color:var(--accent);text-decoration:none}

@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>JARVIS OPS</h1>
      <div class="meta">Agentra AI Agency | Project + Conversation Monitor</div>
    </div>
    <div class="meta" id="timestamp"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <section>
      <h2>Kanban | Live Workstreams</h2>
      <div class="body">
        <div class="kanban" id="kanban"></div>
      </div>
    </section>
    <section>
      <h2>Latest Conversations</h2>
      <div class="body" id="conversations"></div>

  </div>

  <section>

    <div class="body" id="deliverables"></div>
  </section>
</div>

<div class="modal" id="task-modal">
  <div class="modal-card">
    <div class="modal-close" onclick="closeModal()">×</div>
    <h3 id="modal-title"></h3>
    <div class="modal-tag" id="modal-tag"></div>
    <p id="modal-desc"></p>
    <div class="modal-links" id="modal-links"></div>
  </div>
</div>

<script>
const stats=[
  {label:'Active Projects',value:8,style:'neutral'},
  {label:'Lead Briefs',value:8,style:'good'},
  {label:'Web Apps',value:5,style:'good'},
  {label:'Cron Jobs',value:4,style:'warn'},

const kanban={

    {title:'AWS FinOps Guard',desc:'Terraform wiring for EventBridge → Step Functions → Lambda → Dynamo + sample data + mock Bedrock summary.',tag:'Cloud Agents',links:['projects/cloud-agents/aws-finops-guard/README.md','projects/cloud-agents/aws-finops-guard/infrastructure/terraform/main.tf']},

  ],

    {title:'SLC flight tracker',desc:'Map + OpenSky data for Southwest 3945/4870 + return legs, hosted publicly.',tag:'Web',links:['projects/slc-flight-tracker/README.md']},
    {title:'Olympian equipment tracker',desc:'Public web prototype for JV & Varsity gear inventory + checkout.',tag:'Web',links:['projects/olympian-equipment-app/README.md']},
    {title:'Agentra design system',desc:'Document 2026-grade web strategy, tokens, and Storybook scaffolding for all initiatives.',tag:'Design',links:['research/web-design-2026.md','projects/agentra-design-system/']}
    {title:'Lupus Awareness Lab CMS',desc:'Nightingale-inspired rebuild + GitHub Pages + Formspree bridge with mobile-first CSS.',tag:'Web',links:['https://topdawg619.github.io/lupus-awareness-site/','https://github.com/topdawg619/lupus-awareness-site']},
    {title:'Backups + AWS CLI',desc:'Workspace git snapshot, tarball, gateway config, AWS CLI v2 with new key.',tag:'Infra',links:['/home/csmith/backups/2026-02-12']}],
  done:[
    {title:'Dashboard rewrite',desc:'Turn static HUD into Kanban + convo log so Chris can track everything in one glance.',tag:'Dashboard',links:['projects/dashboard/index.html']},
    {title:'Lead briefs v3',desc:'Cincy, M&T, Broadridge, DLH, Scripps, Columbia, Western Alliance, ICW delivered with PDFs.',tag:'Leads'},
    {title:'DAKboard BHM backgrounds',desc:'17 portrait designs (Feb 12-28) matched to user feedback.',tag:'Creative'},
    {title:'Hot Wheels toolkit',desc:'8-file reference pack (scale, printing, paint, lighting).',tag:'Docs'}
  ]
};

const conversations=[
  {time:'18:36',title:'AI design standard',body:'Chris reiterated that I need to operate at elite AI design level for all agency builds.'},
  {time:'18:31',title:'SLC trip flight tracker request',body:'Chris shared full Southwest itinerary (SAN→DEN→SLC etc.) and wants a live web tracker with map.'},
  {time:'09:05',title:'Varsity roster synced',body:'Updated the equipment tracker with the full 2025-26 Olympian varsity roster from the screenshots.'},
  {time:'08:48',title:'Olympian roster update',body:'Loaded the JV/Varsity names from Chris’s screenshots into the equipment tracker demo.'},
  {time:'08:40',title:'Olympian equipment app request',body:'Chris asked for a public web prototype to track JV/Varsity football equipment.'},
  {time:'08:25',title:'2026 web strategy directive',body:'Chris asked for a deep dive into modern web design strategies and documentation.'},
  {time:'08:11',title:'Design system directive',body:'Chris asked for a deep dive on 2026 web design strategies and green-lit building the Agentra design system.'},
  {time:'00:10',title:'Lupus banner hero added',body:'Dropped the Lupus Awareness Lab marketing banner into the site header and deployed to GitHub Pages.'},
  {time:'23:55',title:'Paused for SKO readiness',body:'Moved active cloud/web workstreams back to backlog since they won’t finish before SKO.'},
  {time:'23:46',title:'Agentra site marked done',body:'Moved the Agentra showcase card into Done per Chris’s request.'},
  {time:'23:40',title:'Dashboard card state request',body:'Chris asked to mark Dashboard rewrite as done and reminded me to log conversations for every change.'},
  {time:'23:28',title:'Multi-cloud gallery + schema',body:'Built landing page + workflows.json so we can showcase AWS/Azure/GCP agents and feed future docs.'},
  {time:'23:05',title:'AWS FinOps Guard stack',body:'Hooked EventBridge → Step Functions → mock Bedrock Lambda → DynamoDB plus sample data + cost anomaly event for demos.'},
  {time:'22:45',title:'Directive: return to AWS',body:'Chris pulled us back to the FinOps Guard build to keep the cloud agent work moving.'},

  {time:'22:37',title:'Lupus site Nightingale rebuild',body:'Recreated hero/article layout, reaction widget, newsletter CTA, and stats card UI; published to GitHub Pages.'},
  {time:'22:35',title:'Mobile-first directive',body:'Added tablet/phone breakpoints so nav, CTAs, reaction buttons, and cards are thumb-friendly.'},
  {time:'22:33',title:'Dashboard accountability reminder',body:'Chris reiterated every chat + deliverable must be logged here without prompting.'},
  {time:'03:56',title:'Cox-RapidScale alignment ask',body:'Need ready-lead checklist, timeline, SLA, quick-win menu to present to RPM.'},
  {time:'22:20',title:'Lupus research request',body:'Deep dive so Jarvis understands pathophysiology, meds, monitoring for Rosadela.'},
  {time:'19:17',title:'Multi-cloud agent mandate',body:'Chris asked for deep-dive AI agent workflows + webapps for AWS, Azure, GCP while he’s at the Pitt.'},
  {time:'19:13',title:'Dashboard becomes project source of truth',body:'Chris wants every chat, deliverable, and kanban state mirrored here. Bold directive to customize freely.'},
  {time:'19:05',title:'Agentra site staging on S3',body:'Multi-cloud badges, RAG copy, AWS/GCP logo saga resolved with inline SVG failover then CDN files.'},
  {time:'18:44',title:'Voice UI config automation',body:'Gateway endpoint exposed via Cloudflare, config JSON auto-loaded, iPad instructions documented.'},
  {time:'18:20',title:'Workspace protection',body:'Git init + initial commits, tarball + gateway-config.json backup, RESTORE.md playbook.'},
  {time:'17:30',title:'Lead pipeline briefing',body:'Eight CRO-ready briefs with $4.7M+ modeled MRR, West Coast targets prioritized.'}
];

const deliverables=[
  {title:'SLC Flight Tracker',desc:'Live Leaflet map + OpenSky polling for SWA3945/4870/2141/4031.',link:'https://topdawg619.github.io/slc-flight-tracker/'},
  {title:'Olympian Equipment Tracker',desc:'Public JV/Varsity gear-tracking prototype with live inventory + checkout flows.',link:'https://topdawg619.github.io/olympian-equipment-app/'},
  {title:'Multi-cloud Agent Gallery',desc:'Landing page + JSON schema for AWS/Azure/GCP AI agents.',link:'/home/csmith/.openclaw/workspace/projects/cloud-agents/multi-cloud-gallery/index.html'},
  {title:'AWS FinOps Guard IaC',desc:'Step Functions ASL, Terraform, mock Bedrock Lambda, and sample anomaly payloads for demos.',link:'/home/csmith/.openclaw/workspace/projects/cloud-agents/aws-finops-guard/'},
  {title:'Lupus Awareness Lab v2',desc:'Nightingale-style hero, reaction widget, newsletter CTA, and mobile-first layout for daily research drops.',link:'https://topdawg619.github.io/lupus-awareness-site/'},
  {title:'Lupus Awareness Lab Repo',desc:'Static CMS generator with mirrored docs/ for GitHub Pages.',link:'https://github.com/topdawg619/lupus-awareness-site'},
  {title:'Agentra Showcase (staging)',desc:'AWS S3 website hosting with multi-cloud + RAG messaging.',link:'http://agentra-agency-site.s3-website-us-west-2.amazonaws.com'},
  {title:'Agentra Source',desc:'Single-file site in workspace for future edits.',link:'/home/csmith/.openclaw/workspace/projects/agentra-site/index.html'},
  {title:'AI Agent Workflows Doc',desc:'Research blueprint for AWS/Azure/GCP agent webapps.',link:'/home/csmith/.openclaw/workspace/research/ai-agent-workflows.md'},
  {title:'Lupus Master Notes',desc:'Rosadela-specific plan + pathophysiology deep dive.',link:'/home/csmith/.openclaw/workspace/research/lupus-master-notes.md'},
  {title:'Jarvis Voice UI',desc:'HUD interface tied to OpenClaw gateway.',link:'https://topdawg619.github.io/jarvis-voice/'},
  {title:'Dashboard repo',desc:'This Kanban board source.',link:'https://github.com/topdawg619/jarvis-dashboard'},
  {title:'Backups',desc:'/home/csmith/backups/2026-02-12/workspace.tar.gz + gateway-config.json',link:'/home/csmith/backups/2026-02-12'},
  {title:'Cox-RapidScale Alignment Plan',desc:'Ready-lead checklist, timeline, SLA + quick-win menu for RPM.',link:'/home/csmith/.openclaw/workspace/research/cox-rapidscale-alignment.md'},
  {title:'Cox Alignment Slides + Timeline',desc:'Deck + PNG graphic for RPM presentation.',link:'/home/csmith/.openclaw/workspace/research/cox-rapidscale-alignment.pptx'}
];

// render stats
const statsWrap=document.getElementById('stats');
stats.forEach(s=>{const card=document.createElement('div');card.className=`stat-card ${s.style}`;card.innerHTML=`<div class="label">${s.label}</div><div class="value">${s.value}</div>`;statsWrap.appendChild(card);});

// render kanban
const lanes=[{name:'Backlog',items:kanban.backlog},{name:'In Progress',items:kanban.progress},{name:'Done',items:kanban.done}];
const kanbanWrap=document.getElementById('kanban');
lanes.forEach(l=>{const col=document.createElement('div');col.className='column';col.innerHTML=`<header><h3>${l.name}</h3><span>${l.items.length}</span></header>`;const cards=document.createElement('div');cards.className='cards';l.items.forEach((task,idx)=>{const card=document.createElement('div');card.className='task';card.dataset.column=l.name;card.dataset.index=idx;card.addEventListener('click',()=>openModal(l.name,idx));const links=task.links?.map(h=>`<a href="${h}" target="_blank">link</a>`).join(' ');card.innerHTML=`<h4>${task.title}</h4><p>${task.desc}</p><div class="tag">${task.tag}</div>${links?`<div class="links">${links}</div>`:''}`;cards.appendChild(card);});col.appendChild(cards);kanbanWrap.appendChild(col);});

// conversations
const convoWrap=document.getElementById('conversations');
conversations.forEach(c=>{const div=document.createElement('div');div.className='convo-item';div.innerHTML=`<div class="convo-meta">${c.time} PST</div><div class="convo-title">${c.title}</div><div class="convo-body">${c.body}</div>`;convoWrap.appendChild(div);});

// deliverables
const delWrap=document.getElementById('deliverables');
deliverables.forEach(d=>{const div=document.createElement('div');div.className='deliverable';div.innerHTML=`<h4>${d.title}</h4><p>${d.desc}</p>${d.link?`<a href="${d.link}" target="_blank">${d.link}</a>`:''}`;delWrap.appendChild(div);});

const columnMap={Backlog:kanban.backlog,'In Progress':kanban.progress,Done:kanban.done};
function openModal(columnName,index){const tasks=columnMap[columnName];if(!tasks)return;const task=tasks[index];if(!task)return;document.getElementById('modal-title').textContent=task.title;document.getElementById('modal-tag').textContent=`${columnName.toUpperCase()} | ${task.tag}`;document.getElementById('modal-desc').textContent=task.desc;const linksDiv=document.getElementById('modal-links');linksDiv.innerHTML='';(task.links||[]).forEach(link=>{const a=document.createElement('a');a.href=link;a.target='_blank';try{a.textContent=link.startsWith('http')?new URL(link).hostname:link;}catch(e){a.textContent=link;}linksDiv.appendChild(a);});document.getElementById('task-modal').classList.add('open');}
function closeModal(){document.getElementById('task-modal').classList.remove('open');}
document.getElementById('task-modal').addEventListener('click',e=>{if(e.target.id==='task-modal'){closeModal();}});

document.getElementById('timestamp').textContent='Updated '+new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
</script>
</body>
</html>
